name: Sync to Destination Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Destination Repo
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          git config --global user.name "awais786ahmad"
          git config --global user.email "awaisahmad.freelancer@gmail.com"
          
          # Force git to use your Personal Access Token instead of any cached tokens
          git remote add destination https://x-access-token:${ACTION_TOKEN}@github.com/awais786ahmad/thebegumbeauty.git
          git push destination main --force

name: Sync to Destination Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Destination Repo
        env:
          ACTION_TOKEN: ${{ secrets.ACTION_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${ACTION_TOKEN}@github.com/awais786ahmad/thebegumbeauty.git
          git config --global user.name "awais786ahmad"
          git config --global user.name "awaisahmad.freelancer@gmail.com"
          git push https://x-access-token:${ACTION_TOKEN}@github.com/awais786ahmad/thebegumbeauty.git main --force
